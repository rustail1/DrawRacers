name: Contract Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run contract checks
        run: python verify.py
      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          version: 1.1.0
      - name: Install Roblox toolchain
        run: rokit install
      - name: Build Rojo project
        run: rojo build default.project.json -o /tmp/DrawRacersDev.rbxlx
